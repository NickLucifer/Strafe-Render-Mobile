name: Strafe Render APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Strafe Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Strafe Render
        uses: actions/checkout@v4

      - name: Clone MobileGlues plugin
        run: |
          git clone --recursive https://github.com/MobileGL-Dev/MobileGlues-plugin.git mobileglues-plugin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Build MobileGlues
        working-directory: mobileglues-plugin
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK to Strafe Render
        run: |
          mkdir -p output
          find mobileglues-plugin -type f -name "*.apk" -print -exec cp {} output/Strafe-Render.apk \;

      - name: Upload Strafe Render APK
        uses: actions/upload-artifact@v4
        with:
          name: Strafe-Render-APK
          path: output/Strafe-Render.apk
          if-no-files-found: error
