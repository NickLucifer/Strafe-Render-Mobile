name: Build Strafe Render APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Strafe Render project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK + NDK
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.3.13750724"

      - name: Download stable MobileGlues plugin source
        run: |
          git clone --depth 1 --branch v1.3.5 --recurse-submodules \
            https://github.com/MobileGL-Dev/MobileGlues-plugin.git upstream

      - name: Apply Strafe Render branding/config
        run: |
          bash scripts/patch_upstream.sh "$GITHUB_WORKSPACE/upstream"

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp upstream/app/build/outputs/apk/debug/app-debug.apk \
             dist/Strafe-Render-debug.apk

      - name: Upload Strafe Render APK
        uses: actions/upload-artifact@v4
        with:
          name: Strafe-Render-debug
          path: dist/Strafe-Render-debug.apk
          if-no-files-found: error
